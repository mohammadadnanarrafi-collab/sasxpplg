   ready: true = Ready Stock, false = Pre-order

const destinations = {
  singapore: { name: { en: "Singapore", id: "Singapura" },        base: 20, perKg: 2.5, days: [4, 7] },
  australia: { name: { en: "Australia", id: "Australia" },        base: 30, perKg: 3.5, days: [10, 16] },

  germany:   { name: { en: "Germany", id: "Jerman" },             base: 50, perKg: 5,   days: [21, 30] },
  usa:       { name: { en: "United States", id: "Amerika Serikat" }, base: 60, perKg: 6, days: [25, 35] }
};

// Pesanan demo (stage = tahap berjalan, mulai dari 0)
const orders = {
  "RTN-1001": { stage: 2, country: "germany" },
  "RTN-1002": { stage: 4, country: "japan" }
};

/* =====================================================
   3. STATE (data yang berubah saat dipakai)
   ===================================================== */
let lang = "en";            // bahasa aktif
let cart = [];              // isi keranjang: {pid, vi, qty}
const chosen = {};          // varian terpilih tiap produk
let trackedCode = "";       // kode yang sedang dilacak

const $ = id => document.getElementById(id);
const t = key => text[lang][key];                 // ambil teks sesuai bahasa aktif
const money = n => "$" + n.toFixed(2);

/* =====================================================
   4. GANTI BAHASA
   ===================================================== */
function setLang(l) {
  lang = l;
  try { localStorage.setItem("lang", l); } catch (e) {}   // ingat pilihan bahasa
  document.documentElement.lang = l;

  // Terjemahkan semua elemen statis
  document.querySelectorAll("[data-i18n]").forEach(el => el.innerHTML = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));

  // Status tombol aktif
  $("btn-en").classList.toggle("active", l === "en");
  $("btn-id").classList.toggle("active", l === "id");

  // Render ulang bagian dinamis
  renderCountries();
  renderProducts();
  renderCart();
  renderTracking();
  $("orderMsg").innerHTML = "";
}

/* =====================================================
   5. PRODUK
   ===================================================== */
function renderProducts() {
  $("productList").innerHTML = products.map(p => {
    const vi = chosen[p.id] || 0;
    const v = p.variants[vi];
    return `
    <div class="col-md-6 col-lg-4">
      <div class="card product-card">
        <div class="product-img" id="img-${p.id}" style="background:${v.color}">
          <span class="status-badge ${p.ready ? "status-ready" : "status-notready"}">${p.ready ? t("ready") : t("notready")}</span>
          <span>${p.icon}</span>
        </div>
        <div class="card-body p-4">
          <h5>${p.name[lang]}</h5>
          <p class="price mb-2">${money(p.price)}</p>
          <p class="small mb-1">${t("variant")}: <strong id="vname-${p.id}">${v.n[lang]}</strong></p>
          <div class="d-flex gap-2 mb-3">
            ${p.variants.map((x, i) => `<button class="variant-btn ${i === vi ? "active" : ""}"
               style="background:${x.color}" title="${x.n[lang]}" onclick="selectVariant(${p.id}, ${i}, this)"></button>`).join("")}
          </div>
          <button class="btn ${p.ready ? "btn-brand" : "btn-outline-brand"} w-100" onclick="addToCart(${p.id})">
            ${p.ready ? t("add") : t("preorder")}
          </button>
        </div>
      </div>
    </div>`;
  }).join("");
}

function selectVariant(pid, i, btn) {
  const p = products.find(x => x.id === pid);
  chosen[pid] = i;
  $("img-" + pid).style.background = p.variants[i].color;
  $("vname-" + pid).textContent = p.variants[i].n[lang];
  btn.parentElement.querySelectorAll(".variant-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
}

/* =====================================================
   6. KERANJANG / KASIR
   ===================================================== */
function addToCart(pid) {
  const vi = chosen[pid] || 0;
  const found = cart.find(i => i.pid === pid && i.vi === vi);
  if (found) found.qty++; else cart.push({ pid, vi, qty: 1 });
  renderCart();
  $("cashier").scrollIntoView();
}

function changeQty(pid, vi, delta) {
  const item = cart.find(i => i.pid === pid && i.vi === vi);
  item.qty += delta;
  if (item.qty <= 0) cart = cart.filter(i => i !== item);
  renderCart();
}

function renderCart() {
  $("cartBody").innerHTML = cart.length ? cart.map(i => {
    const p = products.find(x => x.id === i.pid);
    return `<tr>
      <td>${p.name[lang]} ${p.ready ? "" : `<span class="badge bg-secondary">${t("pre_badge")}</span>`}</td>
      <td>${p.variants[i.vi].n[lang]}</td>
      <td>
        <button class="qty-btn" onclick="changeQty(${i.pid}, ${i.vi}, -1)">−</button>
        <span class="mx-2">${i.qty}</span>
        <button class="qty-btn" onclick="changeQty(${i.pid}, ${i.vi}, 1)">+</button>
      </td>
      <td class="text-end">${money(p.price * i.qty)}</td>
      <td><button class="btn btn-sm text-danger" onclick="changeQty(${i.pid}, ${i.vi}, -99)">✕</button></td>
    </tr>`;
  }).join("") : `<tr><td colspan="5" class="text-center text-muted py-4">${t("empty")}</td></tr>`;
  updateSummary();
}

/* =====================================================
   7. TOTAL, ONGKIR & ESTIMASI TIBA
   ===================================================== */

  const current = $("country").value || "singapore";
  $("country").innerHTML = Object.keys(destinations)
    .map(k => `<option value="${k}">${destinations[k].name[lang]}</option>`).join("");
  $("country").value = current;
}

function updateSummary() {
  const d = destinations[$("country").value];
  let itemsTotal = 0, weight = 0, hasPreorder = false;
  cart.forEach(i => {
    const p = products.find(x => x.id === i.pid);
    itemsTotal += p.price * i.qty;
    weight += p.weight * i.qty;
    if (!p.ready) hasPreorder = true;
  });
  const shipping = cart.length ? d.base + d.perKg * weight : 0;

  $("sumItems").textContent = money(itemsTotal);
  $("sumWeight").textContent = weight.toFixed(1) + " kg";
  $("sumShip").textContent = money(shipping);
  $("sumTotal").textContent = money(itemsTotal + shipping);

  if (!cart.length) { $("etaText").textContent = t("eta_empty"); return; }

  const extra = hasPreorder ? 25 : 0;                       // tambahan hari produksi
  const fmt = days => {
    const date = new Date(); date.setDate(date.getDate() + days + extra);
    return date.toLocaleDateString(lang === "id" ? "id-ID" : "en-GB", { day: "numeric", month: "short", year: "numeric" });
  };
  $("etaText").textContent = `${fmt(d.days[0])} – ${fmt(d.days[1])}` + (extra ? " " + t("eta_prod") : "");
}

/* =====================================================
   8. PESAN SEKARANG
   ===================================================== */
$("checkoutBtn").onclick = () => {
  if (!cart.length) { $("orderMsg").innerHTML = `<div class="alert alert-warning">${t("add_first")}</div>`; return; }
  const code = "RTN-" + Math.floor(2000 + Math.random() * 7999);
  orders[code] = { stage: 0, country: $("country").value };
  $("orderMsg").innerHTML = `<div class="alert alert-success">${t("order_ok")} <strong>${code}</strong></div>`;
  $("trackInput").value = code;
  cart = []; renderCart();
};

/* =====================================================
   9. LACAK PENGIRIMAN
   ===================================================== */
$("trackBtn").onclick = () => {
  trackedCode = $("trackInput").value.trim().toUpperCase();
  renderTracking();
};

function renderTracking() {
  if (!trackedCode) { $("trackResult").innerHTML = ""; return; }
  const o = orders[trackedCode];
  if (!o) { $("trackResult").innerHTML = `<div class="alert alert-danger mt-3">${t("not_found")}</div>`; return; }
  const stages = t("stages");
  $("trackResult").innerHTML = `
    <p class="mt-3 mb-0">${t("order_label")} <strong>${trackedCode}</strong> → ${destinations[o.country].name[lang]}</p>
    <p class="text-blue">${t("status_now")} <strong>${stages[o.stage]}</strong></p>
    <ul class="timeline">
      ${stages.map((s, i) => `<li class="${i < o.stage ? "done" : i === o.stage ? "current" : ""}">
        <span class="dot">${i < o.stage ? "✓" : i + 1}</span>${s}</li>`).join("")}
    </ul>`;
}

/* =====================================================
   10. MULAI (pakai bahasa tersimpan, default Inggris)
   ===================================================== */
$("country").onchange = updateSummary;
let saved = "en";
try { saved = localStorage.getItem("lang") || "en"; } catch (e) {}
setLang(saved);
</script>
</body>
</html>
